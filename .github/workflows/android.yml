name: Rated Android

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the Android project
        id: p
        run: |
          if [ -f Rated.zip ] || [ -f RatingApp.zip ]; then
            ARCHIVE=Rated.zip
            [ -f "$ARCHIVE" ] || ARCHIVE=RatingApp.zip
            mkdir -p _src && unzip -q -o "$ARCHIVE" -d _src
            F=$(find _src -name settings.gradle.kts -not -path '*/__MACOSX/*' | head -1)
          else
            F=$(find . -maxdepth 3 -name settings.gradle.kts | head -1)
          fi
          [ -n "$F" ] || { echo "::error::Could not find settings.gradle.kts or a Rated project ZIP."; exit 1; }
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ steps.p.outputs.dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            export VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            export VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            gradle assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Rated-$VERSION_NAME.apk"
          else
            echo "::notice::No signing secrets set; building a debug-signed APK."
            gradle assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Rated-$VERSION_NAME.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Rated-apk
          path: Rated-*.apk

      - name: Attach APK to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: Rated-*.apk
          overwrite_files: true
